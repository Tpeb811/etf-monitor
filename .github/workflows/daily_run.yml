name: ETF Monitor Daily Run

# 触发条件：每天早上 9:30 自动运行（UTC 1:30 = 北京时间 9:30）
# 同时也支持手动点击运行
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

# 必须加上这些权限，否则无法写入 Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 运行 ETF 监控脚本
      - name: Run ETF Monitor Script
        run: python etf_monitor.py

      # 5. 准备部署
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 6. 上传 html_output 文件夹（包含 index.html 和 Excel 文件）
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './html_output'

      # 7. 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
